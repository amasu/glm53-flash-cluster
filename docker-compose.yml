# GLM-5.3-Flash on 2x DGX Spark — vLLM TP=2 (single common compose file).
#
# ONE file for every stack (lab, lab-vision, v9-512k, v9-262k-fp8, v8-262k).
# The stack is selected by configuration only: the launcher (cluster.sh)
# sources the site .env plus stacks/<STACK>.env and runs THIS file with those
# variables in its environment. Nothing stack-specific is hardcoded here —
# choose another stack and the same file/code path serves it.
#
# Host-agnostic: site values (hosts, IPs, fabric) come from .env; serving
# knobs (KV pin, ctx, MTP, mm flags) come from stacks/<STACK>.env. Fail-fast
# is enforced with :? expansions.
#
# Launch order (mp executor): worker (rank 1) first, then head (rank 0) —
# enforced by cluster.sh. Weights are pre-staged at WEIGHTS_DIR on BOTH nodes
# (set per-stack in stacks/<STACK>.env).

services:
  glm53-head:
    image: ${IMAGE:?IMAGE must be set (stacks/<STACK>.env)}
    container_name: glm53-head
    init: true
    restart: "no"
    network_mode: host
    ipc: host
    shm_size: 32gb
    # Endpoint liveness for `docker ps` / `cluster.sh status` (rank 0 only —
    # the worker rank is headless). $$ defers expansion to the container
    # runtime, so the check uses the container's own SERVING_PORT env and
    # follows whatever port the stack serves on.
    # No restart policy ties to it (restart: "no" + watchdog owns recovery);
    # this surfaces crash-looping engines as `unhealthy` instead of `Up`.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$$SERVING_PORT/v1/models >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30m   # engine warmup takes 14-21 min (cold)
    cap_add: [IPC_LOCK]
    ulimits:
      memlock:
        soft: -1
        hard: -1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    devices:
      - /dev/infiniband:/dev/infiniband
    volumes:
      - ./exec-vllm.sh:/exec-vllm.sh:ro
      - ${WEIGHTS_DIR:?WEIGHTS_DIR must be set (stacks/<STACK>.env)}:/models/model:ro
      - ${VLLM_CACHE_DIR:-/var/tmp/glm53-vllm-cache}:/cache
    entrypoint: ["/bin/bash"]
    command: ["/exec-vllm.sh"]
    environment:
      # --- node plumbing (per service) -------------------------------------
      - NODE_RANK=0
      - MODEL_PATH=/models/model
      - HEAD_ADDR=${HEAD_IP:?HEAD_IP must be set in .env}
      - VLLM_HOST_IP=${HEAD_IP:?HEAD_IP must be set in .env}
      - HEADLESS=
      # --- passed through from the launcher's sourced environment ----------
      - STACK_NAME
      - SERVED_MODEL_NAME
      - GPU_MEMORY_UTILIZATION
      - KV_CACHE_DTYPE
      - KV_CACHE_MEMORY_BYTES
      - MAX_MODEL_LEN
      - MAX_NUM_SEQS
      - BLOCK_SIZE
      - MAX_NUM_BATCHED_TOKENS
      - MOE_BACKEND
      - SPECULATIVE_CONFIG
      - KERNEL_CONFIG
      - LIMIT_MM_PER_PROMPT
      - SWITCHES
      - TENSOR_PARALLEL_SIZE
      - MASTER_PORT
      - SERVING_PORT
      - VLLM_MLA_NOPE_PAD_ROPE
      - TORCH_USE_RTLD_GLOBAL
      - VLLM_USE_AOT_COMPILE
      - OMP_NUM_THREADS
      - FLASHINFER_DISABLE_VERSION_CHECK
      # --- common runtime (identical for every stack) -----------------------
      - HF_HOME=/cache/huggingface
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - VLLM_ENGINE_READY_TIMEOUT_S=3600
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - TORCH_CUDA_ARCH_LIST=12.1a
      - FLASHINFER_CUDA_ARCH_LIST=12.1a
      # --- common fabric/NCCL (identical for every stack) -------------------
      - NCCL_NET=IB
      - NCCL_IB_DISABLE=0
      - NCCL_IB_HCA=${NCCL_IB_HCA:?NCCL_IB_HCA must be set in .env}
      - NCCL_IB_GID_INDEX=${NCCL_IB_GID_INDEX:-3}
      - NCCL_IB_ROCE_VERSION_NUM=2
      - NCCL_IB_ADDR_FAMILY=AF_INET
      - NCCL_IB_ADDR_RANGE=${FABRIC_RANGE:?FABRIC_RANGE must be set in .env}
      - NCCL_SOCKET_IFNAME=${IF_NAME:?IF_NAME must be set in .env}
      - GLOO_SOCKET_IFNAME=${IF_NAME:?IF_NAME must be set in .env}
      - TP_SOCKET_IFNAME=${IF_NAME:?IF_NAME must be set in .env}
      - MN_IF_NAME=${IF_NAME:?IF_NAME must be set in .env}
      - NCCL_NVLS_ENABLE=0
      - NCCL_CROSS_NIC=0
      - NCCL_IB_MERGE_NICS=0
      - NCCL_CUMEM_ENABLE=0
      - NCCL_IGNORE_CPU_AFFINITY=1
      - NCCL_DEBUG=WARN
      - TORCH_NCCL_ASYNC_ERROR_HANDLING=1

  glm53-worker:
    image: ${IMAGE:?IMAGE must be set (stacks/<STACK>.env)}
    container_name: glm53-worker
    init: true
    restart: "no"
    network_mode: host
    ipc: host
    shm_size: 32gb
    cap_add: [IPC_LOCK]
    ulimits:
      memlock:
        soft: -1
        hard: -1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    devices:
      - /dev/infiniband:/dev/infiniband
    volumes:
      - ./exec-vllm.sh:/exec-vllm.sh:ro
      - ${WEIGHTS_DIR:?WEIGHTS_DIR must be set (stacks/<STACK>.env)}:/models/model:ro
      - ${VLLM_CACHE_DIR:-/var/tmp/glm53-vllm-cache}:/cache
    entrypoint: ["/bin/bash"]
    command: ["/exec-vllm.sh"]
    environment:
      # --- node plumbing (per service) -------------------------------------
      - NODE_RANK=1
      - MODEL_PATH=/models/model
      - HEAD_ADDR=${HEAD_IP:?HEAD_IP must be set in .env}
      - VLLM_HOST_IP=${WORKER_IP:?WORKER_IP must be set in .env}
      - HEADLESS=--headless
      # --- passed through from the launcher's sourced environment ----------
      - STACK_NAME
      - SERVED_MODEL_NAME
      - GPU_MEMORY_UTILIZATION
      - KV_CACHE_DTYPE
      - KV_CACHE_MEMORY_BYTES
      - MAX_MODEL_LEN
      - MAX_NUM_SEQS
      - BLOCK_SIZE
      - MAX_NUM_BATCHED_TOKENS
      - MOE_BACKEND
      - SPECULATIVE_CONFIG
      - KERNEL_CONFIG
      - LIMIT_MM_PER_PROMPT
      - SWITCHES
      - TENSOR_PARALLEL_SIZE
      - MASTER_PORT
      - SERVING_PORT
      - VLLM_MLA_NOPE_PAD_ROPE
      - TORCH_USE_RTLD_GLOBAL
      - VLLM_USE_AOT_COMPILE
      - OMP_NUM_THREADS
      - FLASHINFER_DISABLE_VERSION_CHECK
      # --- common runtime (identical for every stack) -----------------------
      - HF_HOME=/cache/huggingface
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - VLLM_ENGINE_READY_TIMEOUT_S=3600
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - TORCH_CUDA_ARCH_LIST=12.1a
      - FLASHINFER_CUDA_ARCH_LIST=12.1a
      # --- common fabric/NCCL (identical for every stack) -------------------
      - NCCL_NET=IB
      - NCCL_IB_DISABLE=0
      - NCCL_IB_HCA=${NCCL_IB_HCA:?NCCL_IB_HCA must be set in .env}
      - NCCL_IB_GID_INDEX=${NCCL_IB_GID_INDEX:-3}
      - NCCL_IB_ROCE_VERSION_NUM=2
      - NCCL_IB_ADDR_FAMILY=AF_INET
      - NCCL_IB_ADDR_RANGE=${FABRIC_RANGE:?FABRIC_RANGE must be set in .env}
      - NCCL_SOCKET_IFNAME=${IF_NAME:?IF_NAME must be set in .env}
      - GLOO_SOCKET_IFNAME=${IF_NAME:?IF_NAME must be set in .env}
      - TP_SOCKET_IFNAME=${IF_NAME:?IF_NAME must be set in .env}
      - MN_IF_NAME=${IF_NAME:?IF_NAME must be set in .env}
      - NCCL_NVLS_ENABLE=0
      - NCCL_CROSS_NIC=0
      - NCCL_IB_MERGE_NICS=0
      - NCCL_CUMEM_ENABLE=0
      - NCCL_IGNORE_CPU_AFFINITY=1
      - NCCL_DEBUG=WARN
      - TORCH_NCCL_ASYNC_ERROR_HANDLING=1
