# GLM-5.3-Flash-NVFP4 on 2x DGX Spark (aitopatom-6253 head + spark-cfb3 worker)
# vLLM TP=2 over the QSFP/RoCE fabric.
#
# This compose file defines the two vLLM ranks; the launch ORDER is managed by
# cluster.sh on the Mac (worker rank 1 first, then head rank 0) because vLLM's
# mp executor requires the worker to be up before the head completes world init.
#
# The image (glm53:v8 = tonyd2world sm_121 patch chain on
# vllm/vllm-openai:glm53-flash-arm64-cu130) is built on the head by
# build-image.sh and shipped to the worker — this file does NOT build anything.
#
# Weights are pre-staged at /var/tmp/glm-5.3-flash-nvfp4 on BOTH nodes
# (local copies: +33% KV headroom vs NFS, per the reference deploy).

services:
  glm53-head:
    image: glm53:v8
    container_name: vllm_glm53_head
    init: true
    restart: "no"
    network_mode: host
    ipc: host
    shm_size: 32gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    cap_add: [IPC_LOCK]
    ulimits:
      memlock:
        soft: -1
        hard: -1
    devices:
      - /dev/infiniband:/dev/infiniband
    volumes:
      - ./exec-vllm.sh:/exec-vllm.sh:ro
      - /var/tmp/glm-5.3-flash-nvfp4:/models/glm-5.3-flash-nvfp4:ro
      - /var/tmp/glm53-vllm-cache:/cache
    entrypoint: ["/bin/bash"]
    environment:
      - NODE_RANK=0
      - HOST_IP=${HEAD_IP:-10.100.90.1}
      - HEADLESS=
      - HEAD_ADDR=${HEAD_IP:-10.100.90.1}
      - MASTER_PORT=${MASTER_PORT:-29521}
      - SERVING_PORT=${SERVING_PORT:-8000}
      - MODEL_PATH=/models/glm-5.3-flash-nvfp4
      # huggingface / vllm
      - HF_HOME=/cache/huggingface
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - VLLM_HOST_IP=${HEAD_IP:-10.100.90.1}
      - VLLM_ENGINE_READY_TIMEOUT_S=3600
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - TORCH_CUDA_ARCH_LIST=12.1a
      - FLASHINFER_CUDA_ARCH_LIST=12.1a
      - FLASHINFER_DISABLE_VERSION_CHECK=1
      # NCCL over the QSFP fabric (both RoCE PCIe-x4 twins)
      - NCCL_NET=IB
      - NCCL_IB_DISABLE=0
      - NCCL_IB_HCA=${NCCL_IB_HCA:-rocep1s0f1,roceP2p1s0f1}
      - NCCL_IB_GID_INDEX=${NCCL_IB_GID_INDEX:-3}
      - NCCL_IB_ROCE_VERSION_NUM=2
      - NCCL_IB_ADDR_FAMILY=AF_INET
      - NCCL_IB_ADDR_RANGE=${FABRIC_RANGE:-10.100.90.0/24}
      - NCCL_SOCKET_IFNAME=${IF_NAME:-enp1s0f1np1}
      - GLOO_SOCKET_IFNAME=${IF_NAME:-enp1s0f1np1}
      - TP_SOCKET_IFNAME=${IF_NAME:-enp1s0f1np1}
      - MN_IF_NAME=${IF_NAME:-enp1s0f1np1}
      - NCCL_NVLS_ENABLE=0
      - NCCL_CROSS_NIC=0
      - NCCL_IB_MERGE_NICS=0
      - NCCL_CUMEM_ENABLE=0
      - NCCL_IGNORE_CPU_AFFINITY=1
      - NCCL_DEBUG=WARN
      - TORCH_NCCL_ASYNC_ERROR_HANDLING=1
    command: ["/exec-vllm.sh"]

  glm53-worker:
    image: glm53:v8
    container_name: vllm_glm53_worker
    init: true
    restart: "no"
    network_mode: host
    ipc: host
    shm_size: 32gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    cap_add: [IPC_LOCK]
    ulimits:
      memlock:
        soft: -1
        hard: -1
    devices:
      - /dev/infiniband:/dev/infiniband
    volumes:
      - ./exec-vllm.sh:/exec-vllm.sh:ro
      - /var/tmp/glm-5.3-flash-nvfp4:/models/glm-5.3-flash-nvfp4:ro
      - /var/tmp/glm53-vllm-cache:/cache
    entrypoint: ["/bin/bash"]
    environment:
      - NODE_RANK=1
      - HOST_IP=${WORKER_IP:-10.100.90.4}
      - HEADLESS=--headless
      - HEAD_ADDR=${HEAD_IP:-10.100.90.1}
      - MASTER_PORT=${MASTER_PORT:-29521}
      - SERVING_PORT=${SERVING_PORT:-8000}
      - MODEL_PATH=/models/glm-5.3-flash-nvfp4
      # huggingface / vllm
      - HF_HOME=/cache/huggingface
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - VLLM_HOST_IP=${WORKER_IP:-10.100.90.4}
      - VLLM_ENGINE_READY_TIMEOUT_S=3600
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - TORCH_CUDA_ARCH_LIST=12.1a
      - FLASHINFER_CUDA_ARCH_LIST=12.1a
      - FLASHINFER_DISABLE_VERSION_CHECK=1
      # NCCL over the QSFP fabric (both RoCE PCIe-x4 twins)
      - NCCL_NET=IB
      - NCCL_IB_DISABLE=0
      - NCCL_IB_HCA=${NCCL_IB_HCA:-rocep1s0f1,roceP2p1s0f1}
      - NCCL_IB_GID_INDEX=${NCCL_IB_GID_INDEX:-3}
      - NCCL_IB_ROCE_VERSION_NUM=2
      - NCCL_IB_ADDR_FAMILY=AF_INET
      - NCCL_IB_ADDR_RANGE=${FABRIC_RANGE:-10.100.90.0/24}
      - NCCL_SOCKET_IFNAME=${IF_NAME:-enp1s0f1np1}
      - GLOO_SOCKET_IFNAME=${IF_NAME:-enp1s0f1np1}
      - TP_SOCKET_IFNAME=${IF_NAME:-enp1s0f1np1}
      - MN_IF_NAME=${IF_NAME:-enp1s0f1np1}
      - NCCL_NVLS_ENABLE=0
      - NCCL_CROSS_NIC=0
      - NCCL_IB_MERGE_NICS=0
      - NCCL_CUMEM_ENABLE=0
      - NCCL_IGNORE_CPU_AFFINITY=1
      - NCCL_DEBUG=WARN
      - TORCH_NCCL_ASYNC_ERROR_HANDLING=1
    command: ["/exec-vllm.sh"]
