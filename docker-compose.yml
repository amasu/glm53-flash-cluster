# GLM-5.3-Flash-NVFP4 on 2x DGX Spark — vLLM TP=2 over the QSFP/RoCE fabric.
#
# Host-agnostic: ALL site-specific values come from .env (see example.env):
#   HEAD_IP, WORKER_IP, FABRIC_RANGE, IF_NAME, NCCL_IB_HCA, NCCL_IB_GID_INDEX,
#   WEIGHTS_DIR, VLLM_CACHE_DIR, MASTER_PORT, SERVING_PORT, IMAGE
# Run via cluster.sh (worker rank 1 first, then head rank 0) because vLLM's
# mp executor requires the worker to be up before the head completes world init.
#
# The image (default glm53:v8 = tonyd2world sm_121 patch chain on
# vllm/vllm-openai:glm53-flash-arm64-cu130) is built on the head by
# build-image.sh and shipped to the worker — this file does NOT build anything.
#
# Weights are pre-staged at WEIGHTS_DIR on BOTH nodes
# (local copies: +33% KV headroom vs NFS, per the reference deploy).

services:
  glm53-head:
    image: ${IMAGE:?IMAGE must be set in .env}
    container_name: vllm_glm53_head
    init: true
    restart: "no"
    network_mode: host
    ipc: host
    shm_size: 32gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    cap_add: [IPC_LOCK]
    ulimits:
      memlock:
        soft: -1
        hard: -1
    devices:
      - /dev/infiniband:/dev/infiniband
    volumes:
      - ./exec-vllm.sh:/exec-vllm.sh:ro
      - ${WEIGHTS_DIR:?WEIGHTS_DIR must be set in .env}:/models/glm-5.3-flash-nvfp4:ro
      - ${VLLM_CACHE_DIR:?VLLM_CACHE_DIR must be set in .env}:/cache
    entrypoint: ["/bin/bash"]
    environment:
      - NODE_RANK=0
      - HOST_IP=${HEAD_IP:?HEAD_IP must be set in .env}
      - HEADLESS=
      - HEAD_ADDR=${HEAD_IP:?HEAD_IP must be set in .env}
      - MASTER_PORT=${MASTER_PORT:-29521}
      - SERVING_PORT=${SERVING_PORT:-8000}
      - MODEL_PATH=/models/glm-5.3-flash-nvfp4
      # huggingface / vllm
      - HF_HOME=/cache/huggingface
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - VLLM_HOST_IP=${HEAD_IP:?HEAD_IP must be set in .env}
      - VLLM_ENGINE_READY_TIMEOUT_S=3600
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - TORCH_CUDA_ARCH_LIST=12.1a
      - FLASHINFER_CUDA_ARCH_LIST=12.1a
      - FLASHINFER_DISABLE_VERSION_CHECK=1
      # NCCL over the QSFP fabric (both RoCE PCIe-x4 twins)
      - NCCL_NET=IB
      - NCCL_IB_DISABLE=0
      - NCCL_IB_HCA=${NCCL_IB_HCA:?NCCL_IB_HCA must be set in .env}
      - NCCL_IB_GID_INDEX=${NCCL_IB_GID_INDEX:-3}
      - NCCL_IB_ROCE_VERSION_NUM=2
      - NCCL_IB_ADDR_FAMILY=AF_INET
      - NCCL_IB_ADDR_RANGE=${FABRIC_RANGE:?FABRIC_RANGE must be set in .env}
      - NCCL_SOCKET_IFNAME=${IF_NAME:?IF_NAME must be set in .env}
      - GLOO_SOCKET_IFNAME=${IF_NAME:?IF_NAME must be set in .env}
      - TP_SOCKET_IFNAME=${IF_NAME:?IF_NAME must be set in .env}
      - MN_IF_NAME=${IF_NAME:?IF_NAME must be set in .env}
      - NCCL_NVLS_ENABLE=0
      - NCCL_CROSS_NIC=0
      - NCCL_IB_MERGE_NICS=0
      - NCCL_CUMEM_ENABLE=0
      - NCCL_IGNORE_CPU_AFFINITY=1
      - NCCL_DEBUG=WARN
      - TORCH_NCCL_ASYNC_ERROR_HANDLING=1
    command: ["/exec-vllm.sh"]

  glm53-worker:
    image: ${IMAGE:?IMAGE must be set in .env}
    container_name: vllm_glm53_worker
    init: true
    restart: "no"
    network_mode: host
    ipc: host
    shm_size: 32gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    cap_add: [IPC_LOCK]
    ulimits:
      memlock:
        soft: -1
        hard: -1
    devices:
      - /dev/infiniband:/dev/infiniband
    volumes:
      - ./exec-vllm.sh:/exec-vllm.sh:ro
      - ${WEIGHTS_DIR:?WEIGHTS_DIR must be set in .env}:/models/glm-5.3-flash-nvfp4:ro
      - ${VLLM_CACHE_DIR:?VLLM_CACHE_DIR must be set in .env}:/cache
    entrypoint: ["/bin/bash"]
    environment:
      - NODE_RANK=1
      - HOST_IP=${WORKER_IP:?WORKER_IP must be set in .env}
      - HEADLESS=--headless
      - HEAD_ADDR=${HEAD_IP:?HEAD_IP must be set in .env}
      - MASTER_PORT=${MASTER_PORT:-29521}
      - SERVING_PORT=${SERVING_PORT:-8000}
      - MODEL_PATH=/models/glm-5.3-flash-nvfp4
      # huggingface / vllm
      - HF_HOME=/cache/huggingface
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - VLLM_HOST_IP=${WORKER_IP:?WORKER_IP must be set in .env}
      - VLLM_ENGINE_READY_TIMEOUT_S=3600
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - TORCH_CUDA_ARCH_LIST=12.1a
      - FLASHINFER_CUDA_ARCH_LIST=12.1a
      - FLASHINFER_DISABLE_VERSION_CHECK=1
      # NCCL over the QSFP fabric (both RoCE PCIe-x4 twins)
      - NCCL_NET=IB
      - NCCL_IB_DISABLE=0
      - NCCL_IB_HCA=${NCCL_IB_HCA:?NCCL_IB_HCA must be set in .env}
      - NCCL_IB_GID_INDEX=${NCCL_IB_GID_INDEX:-3}
      - NCCL_IB_ROCE_VERSION_NUM=2
      - NCCL_IB_ADDR_FAMILY=AF_INET
      - NCCL_IB_ADDR_RANGE=${FABRIC_RANGE:?FABRIC_RANGE must be set in .env}
      - NCCL_SOCKET_IFNAME=${IF_NAME:?IF_NAME must be set in .env}
      - GLOO_SOCKET_IFNAME=${IF_NAME:?IF_NAME must be set in .env}
      - TP_SOCKET_IFNAME=${IF_NAME:?IF_NAME must be set in .env}
      - MN_IF_NAME=${IF_NAME:?IF_NAME must be set in .env}
      - NCCL_NVLS_ENABLE=0
      - NCCL_CROSS_NIC=0
      - NCCL_IB_MERGE_NICS=0
      - NCCL_CUMEM_ENABLE=0
      - NCCL_IGNORE_CPU_AFFINITY=1
      - NCCL_DEBUG=WARN
      - TORCH_NCCL_ASYNC_ERROR_HANDLING=1
    command: ["/exec-vllm.sh"]
