# GLM-5.3-Flash lab-quant — VISION-ENABLED variant (lab-vision profile).
#
# Delta vs lab/docker-compose-lab.yaml (LMO standing stack): the multimodal
# front-end is ON, shaped by 0rand's proven 2026-08-30 config (forum #381350):
#   * --language-model-only REMOVED (mm processor + vision tower loaded)
#   * --skip-mm-profiling   — don't reserve the max-size MM profile at init
#                             (the default mm-on profile costs ~300K KV tokens;
#                              with skip-mm-profiling the vision tower is
#                              ~60K — sergio_l post #127, verified on this stack)
#   * --limit-mm-per-prompt — modern dict format; the legacy {"video": 1}
#                             format is REJECTED by this vLLM build (0rand
#                             post #130: "barks on the legacy format")
# Everything else matches the standing lab profile: same image, same weights,
# 512K ctx, fp8_ds_mla KV + 10 GiB pin (LAB_KV_CACHE_BYTES), block 256,
# MTP k=3, 1024/16, gm 0.90, enforce-eager, language-model-only OFF.
#
# OOM watch: this is the memory profile closest to the documented warmup-OOM
# rounds (NOTES-512k.md rounds 1–2 = mm ON + gm 0.90 + 10 GiB pin, which died
# at 4096 batched-tokens; 1024 batched-tokens is the lab-stack's proven value).
# IF rank 0 dies mid-warmup with the "Worker proc died unexpectedly" signature,
# re-launch with LAB_VISION_KV_CACHE_BYTES=9448928000 (9 GiB pin — the
# activation-headroom fix that worked for the k4 LibertAIDAI profile,
# benchmarks.md §6). On this stack it is the default since 2026-08-31
# (10 GiB OOMed the warmup forward on GB10; see benchmarks.md §9).
#
# Host-agnostic: same .env contract as docker-compose-lab.yaml.
# Launch (worker rank 1 first, ~20 s gap, then head):
#   docker compose --env-file $ENV -f docker-compose-lab-vision.yaml up -d glm53-vision-worker
#   docker compose --env-file $ENV -f docker-compose-lab-vision.yaml up -d glm53-vision-head
# Tear down: ... down --remove-orphans (both ranks; single-stack policy).

x-vision-base: &vision-base
  image: ${LAB_IMAGE:-glm53:lab}
  init: true
  restart: "no"
  network_mode: host
  ipc: host
  shm_size: 32gb
  cap_add: [IPC_LOCK]
  ulimits:
    memlock:
      soft: -1
      hard: -1
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
  devices:
    - /dev/infiniband:/dev/infiniband
  entrypoint: ["/bin/bash"]
  volumes:
    - ${WEIGHTS_DIR_LAB:?WEIGHTS_DIR_LAB must be set in .env}:/models/glm-5.3-flash-lab-nvfp4:ro

x-vision-env: &vision-env
  # arch / runtime — identical to the lab profile
  TORCH_CUDA_ARCH_LIST: "12.1a"
  FLASHINFER_CUDA_ARCH_LIST: "12.1a"
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  TORCH_USE_RTLD_GLOBAL: "1"
  VLLM_USE_AOT_COMPILE: "0"
  VLLM_ENGINE_READY_TIMEOUT_S: "3600"
  OMP_NUM_THREADS: "4"
  VLLM_MLA_NOPE_PAD_ROPE: "1"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  NCCL_NET: IB
  NCCL_IB_DISABLE: "0"
  NCCL_IB_HCA: ${NCCL_IB_HCA:?NCCL_IB_HCA must be set in .env}
  NCCL_IB_GID_INDEX: ${NCCL_IB_GID_INDEX:-3}
  NCCL_IB_ROCE_VERSION_NUM: "2"
  NCCL_IB_ADDR_FAMILY: AF_INET
  NCCL_IB_ADDR_RANGE: ${FABRIC_RANGE:?FABRIC_RANGE must be set in .env}
  NCCL_SOCKET_IFNAME: ${IF_NAME:?IF_NAME must be set in .env}
  GLOO_SOCKET_IFNAME: ${IF_NAME:?IF_NAME must be set in .env}
  TP_SOCKET_IFNAME: ${IF_NAME:?IF_NAME must be set in .env}
  MN_IF_NAME: ${IF_NAME:?IF_NAME must be set in .env}
  NCCL_NVLS_ENABLE: "0"
  NCCL_CROSS_NIC: "0"
  NCCL_IB_MERGE_NICS: "0"
  NCCL_CUMEM_ENABLE: "0"
  NCCL_IGNORE_CPU_AFFINITY: "1"
  NCCL_DEBUG: WARN
  TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"

services:
  # Rank 0 (head node): serves the API on :8000
  glm53-vision-head:
    <<: *vision-base
    container_name: glm53-vision-head
    profiles: ["lab-vision"]
    environment:
      <<: *vision-env
      NODE_RANK: "0"
      VLLM_HOST_IP: ${HEAD_IP:?HEAD_IP must be set in .env}
    command:
      - -lc
      - |
        set -euo pipefail
        test -f /models/glm-5.3-flash-lab-nvfp4/config.json || { echo "FATAL: lab weights missing" >&2; exit 1; }
        echo "=== glm53-vision rank=0 $(vllm --version 2>/dev/null || echo unknown) ==="
        exec vllm serve /models/glm-5.3-flash-lab-nvfp4 \
          --served-model-name glm-5.3-flash \
          --trust-remote-code \
          --tensor-parallel-size 2 \
          --gpu-memory-utilization 0.90 \
          --kv-cache-dtype fp8_ds_mla \
          --kv-cache-memory-bytes ${LAB_VISION_KV_CACHE_BYTES:-9448928000} \
          --block-size 256 \
          --max-model-len 524288 \
          --max-num-seqs ${LAB_MAX_NUM_SEQS:-16} \
          --max-num-batched-tokens ${LAB_MAX_NUM_BATCHED_TOKENS:-1024} \
          --enable-chunked-prefill \
          --enable-prefix-caching \
          --disable-custom-all-reduce \
          --kernel-config '{"enable_cutedsl_warmup":false,"enable_flashinfer_autotune":false}' \
          --speculative-config '{"method":"mtp","num_speculative_tokens":${LAB_MTP_K:-3}}' \
          --enforce-eager \
          --skip-mm-profiling \
          --limit-mm-per-prompt '{"image": 4, "video": {"count": 1, "num_frames": 32, "width": 512, "height": 512}}' \
          --tool-call-parser glm47 --enable-auto-tool-choice \
          --reasoning-parser glm45 \
          --distributed-executor-backend mp \
          --nnodes 2 --node-rank 0 \
          --master-addr ${HEAD_IP:?HEAD_IP must be set in .env} --master-port ${MASTER_PORT_LAB:-29500} \
          --host 0.0.0.0 --port ${SERVING_PORT:-8000}

  # Rank 1 (worker node, headless)
  glm53-vision-worker:
    <<: *vision-base
    container_name: glm53-vision-worker
    profiles: ["lab-vision"]
    environment:
      <<: *vision-env
      NODE_RANK: "1"
      VLLM_HOST_IP: ${WORKER_IP:?WORKER_IP must be set in .env}
    command:
      - -lc
      - |
        set -euo pipefail
        test -f /models/glm-5.3-flash-lab-nvfp4/config.json || { echo "FATAL: lab weights missing" >&2; exit 1; }
        echo "=== glm53-vision rank=1 $(vllm --version 2>/dev/null || echo unknown) ==="
        exec vllm serve /models/glm-5.3-flash-lab-nvfp4 \
          --served-model-name glm-5.3-flash \
          --trust-remote-code \
          --tensor-parallel-size 2 \
          --gpu-memory-utilization 0.90 \
          --kv-cache-dtype fp8_ds_mla \
          --kv-cache-memory-bytes ${LAB_VISION_KV_CACHE_BYTES:-9448928000} \
          --block-size 256 \
          --max-model-len 524288 \
          --max-num-seqs ${LAB_MAX_NUM_SEQS:-16} \
          --max-num-batched-tokens ${LAB_MAX_NUM_BATCHED_TOKENS:-1024} \
          --enable-chunked-prefill \
          --enable-prefix-caching \
          --disable-custom-all-reduce \
          --kernel-config '{"enable_cutedsl_warmup":false,"enable_flashinfer_autotune":false}' \
          --speculative-config '{"method":"mtp","num_speculative_tokens":${LAB_MTP_K:-3}}' \
          --enforce-eager \
          --skip-mm-profiling \
          --limit-mm-per-prompt '{"image": 4, "video": {"count": 1, "num_frames": 32, "width": 512, "height": 512}}' \
          --tool-call-parser glm47 --enable-auto-tool-choice \
          --reasoning-parser glm45 \
          --distributed-executor-backend mp \
          --nnodes 2 --node-rank 1 \
          --master-addr ${HEAD_IP:?HEAD_IP must be set in .env} --master-port ${MASTER_PORT_LAB:-29500} \
          --headless
