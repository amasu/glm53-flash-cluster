# GLM-5.3-Flash NVFP4 — LOCAL-INFERENCE-LAB mixed-precision quant, standing
# replacement for the LibertAIDAI stack. Serves on :8000 (provider endpoint),
# master port 29500.
#
# Recipe: kilork gist a887667f4f423b7cc324859cd5e32ebd (92/100 tool-eval
# hardmode, seed 42) + 0rand 2x-Spark packaging. Proven flag set:
#   512K ctx, fp8_ds_mla KV + 10 GiB pin, block 256, MTP k=3,
#   enforce-eager, language-model-only, gm 0.90, batched 4096.
# Image: glm53:lab = day-0 base (digest-pinned 905c0293…) + 5 patches
#   (modelopt MTP-namespace fix, naming shim, CC-12.x indexer guards,
#    NoPE-MLA rope-pad) — build context /var/tmp/glm53-lab-build on the head.
#
# Weights: /var/tmp/glm-5.3-flash-lab-nvfp4 on BOTH nodes
#   (local-inference-lab/GLM-5.3-Flash-NVFP4 @ 378ca545…, 186 GB, 59 files).
# Launch: worker (profile lab, service glm53-lab-worker) first, ~20 s gap,
#   then head (service glm53-lab-head). Tear down both with `down`.

x-lab-base: &lab-base
  image: glm53:lab
  init: true
  restart: "no"
  network_mode: host
  ipc: host
  shm_size: 32gb
  cap_add: [IPC_LOCK]
  ulimits:
    memlock:
      soft: -1
      hard: -1
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
  devices:
    - /dev/infiniband:/dev/infiniband
  entrypoint: ["/bin/bash"]
  volumes:
    - /var/tmp/glm-5.3-flash-lab-nvfp4:/models/glm-5.3-flash-lab-nvfp4:ro

x-lab-env: &lab-env
  # arch / runtime
  TORCH_CUDA_ARCH_LIST: "12.1a"
  FLASHINFER_CUDA_ARCH_LIST: "12.1a"
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  TORCH_USE_RTLD_GLOBAL: "1"
  VLLM_USE_AOT_COMPILE: "0"
  VLLM_ENGINE_READY_TIMEOUT_S: "3600"
  OMP_NUM_THREADS: "4"
  # NoPE-MLA rope-pad (load-bearing; mod baked into glm53:lab)
  VLLM_MLA_NOPE_PAD_ROPE: "1"
  # offline weights
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  # fabric (our cluster; matches the standing :8000 stack)
  NCCL_NET: IB
  NCCL_IB_DISABLE: "0"
  NCCL_IB_HCA: "rocep1s0f1,roceP2p1s0f1"
  NCCL_IB_GID_INDEX: "3"
  NCCL_IB_ROCE_VERSION_NUM: "2"
  NCCL_IB_ADDR_FAMILY: AF_INET
  NCCL_IB_ADDR_RANGE: "10.100.90.0/24"
  NCCL_SOCKET_IFNAME: "enp1s0f1np1"
  GLOO_SOCKET_IFNAME: "enp1s0f1np1"
  TP_SOCKET_IFNAME: "enp1s0f1np1"
  MN_IF_NAME: "enp1s0f1np1"
  NCCL_NVLS_ENABLE: "0"
  NCCL_CROSS_NIC: "0"
  NCCL_IB_MERGE_NICS: "0"
  NCCL_CUMEM_ENABLE: "0"
  NCCL_IGNORE_CPU_AFFINITY: "1"
  NCCL_DEBUG: WARN
  TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"

services:
  # Rank 0 (head node): serves the API on :30000
  glm53-lab-head:
    <<: *lab-base
    container_name: glm53-lab-head
    profiles: ["lab"]
    environment:
      <<: *lab-env
      NODE_RANK: "0"
      VLLM_HOST_IP: "10.100.90.1"
    command:
      - -lc
      - |
        set -euo pipefail
        test -f /models/glm-5.3-flash-lab-nvfp4/config.json || { echo "FATAL: lab weights missing" >&2; exit 1; }
        echo "=== glm53-lab rank=0 $(vllm --version 2>/dev/null || echo unknown) ==="
        exec vllm serve /models/glm-5.3-flash-lab-nvfp4 \
          --served-model-name glm-5.3-flash \
          --trust-remote-code \
          --tensor-parallel-size 2 \
          --gpu-memory-utilization 0.90 \
          --kv-cache-dtype fp8_ds_mla \
          --kv-cache-memory-bytes 10737418240 \
          --block-size 256 \
          --max-model-len 524288 \
          --max-num-seqs 8 \
          --max-num-batched-tokens 4096 \
          --enable-chunked-prefill \
          --enable-prefix-caching \
          --disable-custom-all-reduce \
          --kernel-config '{"enable_cutedsl_warmup":false,"enable_flashinfer_autotune":false}' \
          --speculative-config '{"method":"mtp","num_speculative_tokens":3}' \
          --language-model-only \
          --enforce-eager \
          --tool-call-parser glm47 --enable-auto-tool-choice \
          --reasoning-parser glm45 \
          --distributed-executor-backend mp \
          --nnodes 2 --node-rank 0 \
          --master-addr 10.100.90.1 --master-port 29500 \
          --host 0.0.0.0 --port 8000

  # Rank 1 (worker node, headless)
  glm53-lab-worker:
    <<: *lab-base
    container_name: glm53-lab-worker
    profiles: ["lab"]
    environment:
      <<: *lab-env
      NODE_RANK: "1"
      VLLM_HOST_IP: "10.100.90.4"
    command:
      - -lc
      - |
        set -euo pipefail
        test -f /models/glm-5.3-flash-lab-nvfp4/config.json || { echo "FATAL: lab weights missing" >&2; exit 1; }
        echo "=== glm53-lab rank=1 $(vllm --version 2>/dev/null || echo unknown) ==="
        exec vllm serve /models/glm-5.3-flash-lab-nvfp4 \
          --served-model-name glm-5.3-flash \
          --trust-remote-code \
          --tensor-parallel-size 2 \
          --gpu-memory-utilization 0.90 \
          --kv-cache-dtype fp8_ds_mla \
          --kv-cache-memory-bytes 10737418240 \
          --block-size 256 \
          --max-model-len 524288 \
          --max-num-seqs 8 \
          --max-num-batched-tokens 4096 \
          --enable-chunked-prefill \
          --enable-prefix-caching \
          --disable-custom-all-reduce \
          --kernel-config '{"enable_cutedsl_warmup":false,"enable_flashinfer_autotune":false}' \
          --speculative-config '{"method":"mtp","num_speculative_tokens":3}' \
          --language-model-only \
          --enforce-eager \
          --tool-call-parser glm47 --enable-auto-tool-choice \
          --reasoning-parser glm45 \
          --distributed-executor-backend mp \
          --nnodes 2 --node-rank 1 \
          --master-addr 10.100.90.1 --master-port 29500 \
          --headless
